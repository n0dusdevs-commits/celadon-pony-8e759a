<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1f27">
<title>Área da Lojista | May Modas</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/painel.css">
</head>
<body class="painel">
<svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
<symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
<symbol id="i-whatsapp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-4.9A9 9 0 1 1 8 19.4z"/><path d="M9 10c0 3 2.5 5 5 5l1.2-1.4-2-1-.8.7c-.9-.4-1.6-1.1-2-2l.7-.8-1-2z"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<!-- Login -->
<main class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <img src="assets/logo-small.webp" alt="May Modas" class="login-logo">
    <h1 id="loginTitle">Área da Lojista</h1>
    <p class="muted" id="loginSub">Entre para gerenciar pedidos, parcelas e produtos.</p>
    <div class="field"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div class="field" id="passField"><label for="lPass">Senha</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <p class="err" id="loginErr" role="alert"></p>
    <p class="okmsg" id="loginOk" role="status"></p>
    <button class="btn btn-gold btn-block" type="submit" id="loginBtn">Entrar</button>
    <div class="login-links">
      <button type="button" class="linklike" id="toSignup">Primeiro acesso? Criar senha</button>
      <button type="button" class="linklike" id="toReset">Esqueci a senha</button>
    </div>
    <a class="back" href="index.html">← Voltar para o site</a>
  </form>
</main>

<!-- Nova senha (link de recuperação) -->
<main class="login" id="newPassView" hidden>
  <form class="login-card" id="newPassForm" novalidate>
    <img src="assets/logo-small.webp" alt="May Modas" class="login-logo">
    <h1>Nova senha</h1>
    <div class="field"><label for="np1">Nova senha (mín. 8 caracteres)</label><input id="np1" type="password" autocomplete="new-password"></div>
    <p class="err" id="npErr" role="alert"></p>
    <button class="btn btn-gold btn-block" type="submit">Salvar senha</button>
  </form>
</main>

<!-- Painel -->
<div class="app" id="appView" hidden>
  <aside class="side" id="side">
    <img src="assets/logo-small.webp" alt="May Modas" class="side-logo">
    <nav class="side-nav" aria-label="Painel">
      <button type="button" data-view="inicio" class="on">Início</button>
      <button type="button" data-view="pedidos">Pedidos <span class="pill" id="pillNovos" hidden></span></button>
      <button type="button" data-view="parcelas">Parcelas <span class="pill warn" id="pillVencidas" hidden></span></button>
      <button type="button" data-view="produtos">Produtos</button>
      <button type="button" data-view="repasse">Repasse</button>
      <button type="button" data-view="loja">Minha loja</button>
    </nav>
    <div class="side-foot">
      <a href="index.html" target="_blank" rel="noopener">Ver site</a>
      <button type="button" id="logout">Sair</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn mob-menu" id="mobMenu" type="button" aria-label="Menu"><svg class="ico"><use href="#i-menu"/></svg></button>
      <h1 id="viewTitle">Início</h1>
      <span class="who" id="who"></span>
    </header>
    <section id="view"></section>
  </div>
</div>

<dialog class="modal modal-sm" id="dlg"><div class="modal-in" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/vendor/supabase-2.117.2.js"></script>
<script src="js/config.js"></script>
<script src="js/painel.js"></script>
</body>
</html>
